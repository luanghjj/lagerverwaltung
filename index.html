<!-- Init (must be last) -->
<script src="js/init.js?v=3.0.0"></script>
<script>
  if ('serviceWorker' in navigator) {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js')
      .then(r => { console.log('SW registered:', r.scope); setInterval(() => r.update().catch(() => {}), 5 * 60 * 1000); })
      .catch(e => console.log('SW error:', e));
    // Neue Version aktiv → Hinweis zum Neuladen (alte Tabs sollen keinen alten Code weiter ausführen)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadSW || document.getElementById('swUpdBar')) return;
      const b = document.createElement('button');
      b.id = 'swUpdBar'; b.type = 'button';
      b.textContent = (typeof LANG !== 'undefined' && LANG === 'vi') ? '🔄 Có bản mới – bấm để tải lại' : '🔄 Neue Version – tippen zum Neuladen';
      b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:10000;padding:10px 16px;border:0;border-radius:20px;background:var(--ac,#3b82f6);color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4)';
      b.onclick = () => location.reload();
      document.body.appendChild(b);
    });
  }
</script>
