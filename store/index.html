<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Store">
<title>Store — Lieferung & Einkauf</title>
<link rel="manifest" href="/store/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="/store/vendor/supabase.js"><\/script>');}</script>
<style>
  :root {
    --bg:#F4F1EA; --card:#FFFFFF; --ink:#1C1917; --muted:#78716C; --line:#E7E5E4;
    --accent:#0F766E; --accent-soft:#CCFBF1; --warn:#B45309; --warn-soft:#FEF3C7;
    --bad:#B91C1C; --bad-soft:#FEE2E2; --ok:#047857; --ok-soft:#D1FAE5;
    --radius:14px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  .wrap { max-width:720px; margin:0 auto; padding:12px 12px 40px; }

  header.app {
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:10px 12px 8px; border-bottom:1px solid var(--line);
  }
  header.app .row { display:flex; align-items:center; gap:8px; }
  header.app h1 { font-size:18px; margin:0; flex:1; }
  .next { font-size:13px; color:var(--accent); font-weight:700; margin-top:2px; }
  .next.none { color:var(--warn); }
  .who { font-size:13px; color:var(--muted); background:none; border:0; padding:4px 6px; }

  .tabs { display:flex; gap:6px; margin:12px 0; }
  .tabs button {
    flex:1; border:1px solid var(--line); background:var(--card); border-radius:999px;
    padding:9px 6px; font-weight:650; font-size:14px;
  }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px; margin-bottom:10px;
  }
  .card h2 { font-size:15px; margin:0 0 8px; display:flex; align-items:center; gap:6px; }
  .sub { font-size:12.5px; color:var(--muted); font-weight:500; }

  .row2 { display:flex; gap:8px; }
  .row2 > * { flex:1; min-width:0; }
  label.f { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; font-weight:600; }
  .inp, .sel {
    width:100%; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:10px 11px; font-size:16px;
  }
  .btn {
    border:0; border-radius:10px; padding:11px 14px; font-weight:700; background:var(--accent); color:#fff;
  }
  .btn:disabled { opacity:.45; }
  .btn.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn.warn { background:var(--warn); }
  .btn.bad { background:var(--bad); }
  .btn.sm { padding:7px 10px; font-size:13px; border-radius:8px; }
  .btn.block { width:100%; }

  .searchbox { position:relative; }
  .hits {
    position:absolute; left:0; right:0; top:100%; z-index:15; background:#fff;
    border:1px solid var(--line); border-radius:10px; margin-top:3px; max-height:46vh; overflow:auto;
    box-shadow:0 8px 24px rgba(0,0,0,.12);
  }
  .hits button {
    display:flex; width:100%; text-align:left; gap:8px; align-items:center;
    background:none; border:0; border-bottom:1px solid var(--line); padding:9px 11px;
  }
  .hits button:last-child { border-bottom:0; }
  .hits .nm { font-weight:650; flex:1; }
  .hits .meta { font-size:12px; color:var(--muted); }

  .line { display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .line:last-child { border-bottom:0; }
  .line .nm { flex:1; min-width:0; }
  .line .nm b { display:block; }
  .line .nm span { font-size:12px; color:var(--muted); }
  .qty { width:72px; text-align:center; font-weight:700; }
  .x { background:none; border:0; color:var(--muted); font-size:18px; padding:4px 6px; }

  .badge { font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; }
  .badge.plan { background:var(--warn-soft); color:var(--warn); }
  .badge.done { background:var(--ok-soft); color:var(--ok); }
  .neg { color:var(--bad); font-weight:700; }

  .check {
    width:26px; height:26px; border-radius:8px; border:2px solid var(--line); background:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .check.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .line.ticked .nm b { text-decoration:line-through; color:var(--muted); }

  .empty { text-align:center; color:var(--muted); padding:22px 8px; font-size:14px; }
  .err { background:var(--bad-soft); color:var(--bad); border-radius:10px; padding:10px 12px; font-size:13.5px; margin:8px 0; }

  /* Modal */
  .ov {
    position:fixed; inset:0; background:rgba(28,25,23,.45); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet {
    background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;
  }
  .sheet h3 { margin:0 0 8px; font-size:16px; }
  .sheet p { margin:6px 0; font-size:14px; }
  .sheet .acts { display:flex; gap:8px; margin-top:14px; }
  .sheet .acts .btn { flex:1; }
  ul.plain { margin:6px 0; padding-left:18px; font-size:14px; }

  .toast {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:50;
    background:var(--ink); color:#fff; border-radius:999px; padding:9px 16px; font-size:13.5px;
    max-width:90vw;
  }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .center .card { width:100%; max-width:380px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/js/lagerorte.js?v=1"></script>
<script src="/store/app.js?v=1"></script>
</body>
</html>
